name: Apply localized Ask Dashboard refactor

on:
  push:
    branches:
      - agent/localize-and-distill-ui

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run localized Ask Dashboard refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/localize-and-distill-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact-match UI refactor
        run: |
          python scripts/apply_ui_copy_refactor.py
          python - <<'PY'
          from pathlib import Path
          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          old = '"selected_group_impact": "2. Tác động của nhóm đã chọnt",'
          new = '"selected_group_impact": "2. Tác động của nhóm đã chọn",'
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'Vietnamese copy fix: expected 1 match, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python files
        run: python -m py_compile app.py ask_dashboard.py openai_intent.py data_loading.py usage_analytics.py ui_copy.py test_ask_dashboard.py test_alliance_score_overview.py test_data_loading.py test_usage_analytics.py test_ui_copy.py test_ui_copy_shell.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Check diff whitespace
        run: git diff --check
      - name: Commit transformed app
        run: |
          if git diff --quiet -- app.py; then
            echo 'Expected app.py changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Integrate localized Ask Dashboard shell [ui-copy-applied]'
          git push origin HEAD:agent/localize-and-distill-ui
