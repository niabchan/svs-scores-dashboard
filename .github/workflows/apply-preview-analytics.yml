name: Apply preview analytics patch

on:
  push:
    branches:
      - ask-dashboard-wip

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ask-dashboard-wip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply preview analytics patch
        run: python scripts/apply_preview_analytics_patch.py
      - name: Commit patched preview app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/apply-preview-analytics.yml scripts/apply_preview_analytics_patch.py
          git commit -m "Add preview analytics and feedback UI"
          git push
