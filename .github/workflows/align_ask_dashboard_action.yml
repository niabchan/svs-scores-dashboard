name: Align Ask Dashboard action

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-layout:
    if: github.event.pull_request.head.ref == 'agent/localize-and-distill-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/localize-and-distill-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Right-align Ask Dashboard action above tabs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          old = '''if st.button(f"💬 {ask_t('ask_dashboard')}", type="primary"):\n    ask_dashboard_dialog()\n'''
          new = '''ask_dashboard_action = st.container(\n    horizontal=True,\n    horizontal_alignment="right",\n)\nif ask_dashboard_action.button(\n    f"💬 {ask_t('ask_dashboard')}",\n    type="primary",\n):\n    ask_dashboard_dialog()\n'''
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'expected exactly one Ask Dashboard button block, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile and test
        run: |
          python -m py_compile app.py ask_dashboard.py openai_intent.py data_loading.py usage_analytics.py ui_copy.py test_ui_copy.py test_ui_copy_shell.py
          python -m pytest -q
          git diff --check
      - name: Verify Streamlit 1.58 layout API
        run: |
          python -m pip install -r requirements.txt
          python - <<'PY'
          import inspect
          import streamlit as st

          params = inspect.signature(st.container).parameters
          assert 'horizontal' in params
          assert 'horizontal_alignment' in params
          PY
      - name: Commit layout trial
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Right-align Ask Dashboard action'
          git push origin HEAD:agent/localize-and-distill-ui
