name: Apply help routing and copy patch

on:
  push:
    branches:
      - agent/multilingual-ask-answers

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multilingual-ask-answers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Apply exact help routing and copy patch
        run: python scripts/apply_help_routing_copy_patch.py
      - name: Compile changed modules and tests
        run: python -m py_compile ask_dashboard/_routing.py ask_dashboard/_answer_i18n.py test_ask_dashboard.py test_answer_i18n.py
      - name: Run full test suite
        run: |
          python -m pytest -q
          git diff --check
      - name: Commit validated patch
        run: |
          if git diff --quiet -- ask_dashboard/_routing.py ask_dashboard/_answer_i18n.py test_ask_dashboard.py test_answer_i18n.py; then
            echo "Help routing/copy patch already applied."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ask_dashboard/_routing.py ask_dashboard/_answer_i18n.py test_ask_dashboard.py test_answer_i18n.py
          git commit -m 'Route generic help without AI and clarify localized examples'
          git push origin HEAD:agent/multilingual-ask-answers
