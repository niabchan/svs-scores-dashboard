name: Apply answer locale state guard

on:
  push:
    branches:
      - agent/multilingual-ask-answers

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multilingual-ask-answers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Apply exact locale-state patch
        run: python scripts/apply_answer_locale_state_guard.py
      - name: Compile changed modules and tests
        run: python -m py_compile app.py test_answer_i18n.py
      - name: Run full test suite
        run: |
          python -m pytest -q
          git diff --check
      - name: Commit validated locale-state guard
        run: |
          if git diff --quiet -- app.py; then
            echo "Locale-state guard already applied."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Guard cached Ask Dashboard answers by locale'
          git push origin HEAD:agent/multilingual-ask-answers
