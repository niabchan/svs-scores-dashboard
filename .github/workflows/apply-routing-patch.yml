name: Apply routing patch

on:
  push:
    branches:
      - agent/improve-help-and-limitation-routing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/improve-help-and-limitation-routing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refine and apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_routing_patch.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'r"\\\\b(reckless|careless|selfish|malicious|unskilled)\\\\b",',
              'r"\\\\b(reckless|careless|selfish|malicious|skilled|unskilled)\\\\b",',
          )
          text = text.replace(
              'r"\\\\b(motive|motives|character)\\\\b",',
              'r"\\\\b(motive|motives|character|strategy)\\\\b",',
          )
          text = text.replace(
              'r"\\\\b(?:responsible|responsibility|to\\\\s+blame|whose\\\\s+fault|at\\\\s+fault)\\\\b",',
              'r"\\\\b(?:responsible|responsibility|to\\\\s+blame|whose\\\\s+fault|at\\\\s+fault|fault)\\\\b",',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/apply_routing_patch.py
          rm scripts/apply_routing_patch.py
          rm .github/workflows/apply-routing-patch.yml
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile
        run: python -m py_compile app.py ask_dashboard.py openai_intent.py test_ask_dashboard.py
      - name: Test
        run: python -m pytest -q
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ask_dashboard.py test_ask_dashboard.py scripts/apply_routing_patch.py .github/workflows/apply-routing-patch.yml
          git commit -m "Improve help and limitation routing"
          git push origin HEAD:agent/improve-help-and-limitation-routing
