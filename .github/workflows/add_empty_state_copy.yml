name: Add localized empty-state copy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-copy:
    if: github.event.pull_request.head.ref == 'agent/localize-and-distill-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/localize-and-distill-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add localized empty-state messages and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('app.py')
          text = app_path.read_text(encoding='utf-8')

          replacements = [
              (
                  '        "after_exclusion": "**After Exclusion**",\n',
                  '        "after_exclusion": "**After Exclusion**",\n'
                  '        "no_score_data_before_exclusion": "No positive or negative net score to display for the current filters.",\n'
                  '        "no_score_data_after_exclusion": "No positive or negative net score to display for the currently selected players.",\n',
                  'en',
              ),
              (
                  '        "after_exclusion": "**Después de las exclusiones**",\n',
                  '        "after_exclusion": "**Después de las exclusiones**",\n'
                  '        "no_score_data_before_exclusion": "No hay puntuaciones netas positivas ni negativas para mostrar con los filtros actuales.",\n'
                  '        "no_score_data_after_exclusion": "No hay puntuaciones netas positivas ni negativas que mostrar para los jugadores seleccionados actualmente.",\n',
                  'es',
              ),
              (
                  '        "after_exclusion": "**Après les exclusions**",\n',
                  '        "after_exclusion": "**Après les exclusions**",\n'
                  '        "no_score_data_before_exclusion": "Aucun score net positif ou négatif à afficher avec les filtres actuels.",\n'
                  '        "no_score_data_after_exclusion": "Aucun score net positif ou négatif à afficher pour les joueurs actuellement sélectionnés.",\n',
                  'fr',
              ),
              (
                  '        "after_exclusion": "**Sau khi loại người chơi**",\n',
                  '        "after_exclusion": "**Sau khi loại người chơi**",\n'
                  '        "no_score_data_before_exclusion": "Không có điểm ròng dương hoặc âm để hiển thị với các bộ lọc hiện tại.",\n'
                  '        "no_score_data_after_exclusion": "Không có điểm ròng dương hoặc âm để hiển thị cho những người chơi hiện được chọn.",\n',
                  'vi',
              ),
              (
                  '        "after_exclusion": "**Setelah Pengecualian**",\n',
                  '        "after_exclusion": "**Setelah Pengecualian**",\n'
                  '        "no_score_data_before_exclusion": "Tidak ada poin bersih positif atau negatif untuk ditampilkan dengan filter saat ini.",\n'
                  '        "no_score_data_after_exclusion": "Tidak ada poin bersih positif atau negatif untuk ditampilkan bagi pemain yang saat ini dipilih.",\n',
                  'id',
              ),
          ]

          for old, new, locale in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{locale}: expected exactly one after_exclusion anchor, found {count}')
              text = text.replace(old, new, 1)

          app_path.write_text(text, encoding='utf-8')

          test_path = Path('test_ui_copy.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_literal_t_calls_reference_known_translation_keys():'
          if marker in tests:
              raise RuntimeError('literal t() key regression test already exists')

          tests += '''\n\ndef test_literal_t_calls_reference_known_translation_keys():\n    tree = ast.parse(APP_PATH.read_text(encoding="utf-8"), filename=str(APP_PATH))\n    text = _load_literal_assignment("TEXT")\n    known_keys = set(text["en"])\n\n    literal_t_keys = {\n        node.args[0].value\n        for node in ast.walk(tree)\n        if isinstance(node, ast.Call)\n        and isinstance(node.func, ast.Name)\n        and node.func.id == "t"\n        and node.args\n        and isinstance(node.args[0], ast.Constant)\n        and isinstance(node.args[0].value, str)\n    }\n\n    missing = literal_t_keys - known_keys\n    assert not missing, (\n        "Literal t() calls reference missing translation keys: "\n        f"{sorted(missing)}"\n    )\n'''
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile and test
        run: |
          python -m py_compile app.py ask_dashboard.py openai_intent.py data_loading.py usage_analytics.py ui_copy.py test_ui_copy.py test_ui_copy_shell.py
          python -m pytest -q
          git diff --check
      - name: Commit empty-state copy and regression test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py test_ui_copy.py
          git commit -m 'Localize exclusion chart empty states'
          git push origin HEAD:agent/localize-and-distill-ui
