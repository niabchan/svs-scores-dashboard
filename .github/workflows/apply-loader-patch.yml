name: Apply loader patch

on:
  push:
    branches:
      - agent/fix-loader-whitespace

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-loader-whitespace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow app loader patch
        run: python scripts/apply_loader_patch.py
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/apply-loader-patch.yml scripts/apply_loader_patch.py
          git commit -m "Use robust numeric loader"
          git push
