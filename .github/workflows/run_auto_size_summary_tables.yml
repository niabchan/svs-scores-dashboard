name: Run auto-size summary table patch

on:
  push:
    branches:
      - agent/localize-and-distill-ui

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/localize-and-distill-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact patch from temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/auto_size_summary_tables.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'auto_size_summary_tables.py', 'exec'))
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Compile and test
        run: |
          python -m py_compile app.py ask_dashboard.py openai_intent.py data_loading.py table_layout.py usage_analytics.py ui_copy.py test_ask_dashboard.py test_alliance_score_overview.py test_data_loading.py test_table_layout.py test_usage_analytics.py test_ui_copy.py test_ui_copy_shell.py
          python -m pytest -q
          git diff --check

      - name: Verify Streamlit accepts integer column widths
        run: |
          python -m pip install -r requirements.txt
          python - <<'PY'
          import streamlit as st
          column = st.column_config.NumberColumn('Localized header', width=180, format='%,.0f')
          assert column is not None
          PY

      - name: Commit adaptive table layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py table_layout.py test_table_layout.py .github/workflows/tests.yml
          git commit -m 'Auto-size summary table columns'
          git push origin HEAD:agent/localize-and-distill-ui
