name: Apply roadmap patch

on:
  push:
    branches:
      - ask-dashboard-wip

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ask-dashboard-wip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply roadmap changes
        run: python scripts/apply_roadmap_patch.py
      - name: Commit roadmap changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ask_dashboard.py openai_intent.py usage_analytics.py app.py test_usage_analytics.py .github/workflows/tests.yml PREVIEW_ANALYTICS_SETUP.md .github/workflows/apply-roadmap-patch.yml scripts/apply_roadmap_patch.py
          git commit -m "Add alliance overview and secure cloud analytics contract"
          git push
