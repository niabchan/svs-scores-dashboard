name: Restore preferred tab subheaders

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    if: github.event.pull_request.head.ref == 'agent/localize-and-distill-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/localize-and-distill-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore four tab subheaders exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'with tab_overview:\n    # Full-server totals for the selected SVS period only.',
                  'with tab_overview:\n    st.subheader(t("overview"))\n\n    # Full-server totals for the selected SVS period only.',
                  'Overview',
              ),
              (
                  'with tab_alliance:\n    st.caption(',
                  'with tab_alliance:\n    st.subheader(t("alliance_summary"))\n    st.caption(',
                  'Alliance Summary',
              ),
              (
                  'with tab_contribution:\n    st.caption(t("contribution_insight_caption"))',
                  'with tab_contribution:\n    st.header(t("contribution_insight"))\n    st.caption(t("contribution_insight_caption"))',
                  'Contribution Insight',
              ),
              (
                  'with tab_player_selection:\n    st.caption(t("player_selection_insight_caption"))',
                  'with tab_player_selection:\n    st.header(t("player_selection_insight"))\n    st.caption(t("player_selection_insight_caption"))',
                  'Player Selection Insight',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile and test
        run: |
          python -m py_compile app.py ask_dashboard.py openai_intent.py data_loading.py usage_analytics.py ui_copy.py test_ui_copy_shell.py
          python -m pytest -q
          git diff --check
      - name: Commit restored subheaders
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Restore preferred tab subheaders'
          git push origin HEAD:agent/localize-and-distill-ui
