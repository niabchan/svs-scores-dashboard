name: Tests

on:
  pull_request:
  push:
    branches:
      - ask-dashboard-wip
      - work

permissions:
  contents: write

jobs:
  apply-feedback-idempotency-patch:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ask-dashboard-wip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply feedback idempotency patch
        run: python scripts/apply_feedback_idempotency_patch.py
      - name: Commit feedback retry changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usage_analytics.py app.py analytics/google_apps_script/Code.gs test_usage_analytics.py scripts/apply_feedback_idempotency_patch.py
          git commit -m "Make analytics feedback retries idempotent"
          git push

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python files
        run: python -m py_compile app.py ask_dashboard.py openai_intent.py data_loading.py usage_analytics.py test_ask_dashboard.py test_alliance_score_overview.py test_data_loading.py test_usage_analytics.py
      - name: Run tests
        run: python -m pytest -q
