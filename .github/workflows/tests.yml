name: Tests

on:
  pull_request:
  push:
    branches:
      - ask-dashboard-wip
      - work

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/localize-and-distill-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Restore balanced summary table widths
        run: python scripts/revert_adaptive_table_sizing.py
      - name: Compile Python files
        run: python -m py_compile app.py ask_dashboard.py openai_intent.py data_loading.py usage_analytics.py ui_copy.py test_ask_dashboard.py test_alliance_score_overview.py test_data_loading.py test_table_layout.py test_usage_analytics.py test_ui_copy.py test_ui_copy_shell.py
      - name: Run tests
        run: |
          python -m pytest -q
          git diff --check
      - name: Commit summary table sizing revert
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore balanced summary table widths'
          git push origin HEAD:agent/localize-and-distill-ui
