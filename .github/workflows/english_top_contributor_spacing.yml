name: Apply English top-contributor spacing

on:
  push:
    branches:
      - agent/multilingual-ask-answers
    paths:
      - scripts/apply_english_top_contributor_spacing.py
      - .github/workflows/english_top_contributor_spacing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multilingual-ask-answers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Apply spacing patch
        run: python scripts/apply_english_top_contributor_spacing.py
      - name: Compile
        run: python -m py_compile ask_dashboard.py test_answer_i18n.py
      - name: Run tests
        run: |
          python -m pytest -q
          git diff --check
      - name: Commit validated spacing fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ask_dashboard.py test_answer_i18n.py
          git commit -m 'Separate English top-contributor summaries'
          git push origin HEAD:agent/multilingual-ask-answers
