name: Apply multilingual answer wiring

on:
  push:
    branches:
      - agent/multilingual-ask-answers

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multilingual-ask-answers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Apply exact wiring patch
        run: python scripts/apply_multilingual_answer_wiring.py
      - name: Compile changed modules and tests
        run: python -m py_compile app.py ui_copy.py ask_dashboard/_answer_i18n.py ask_dashboard/_ranking_rendering.py test_answer_i18n.py
      - name: Run full test suite
        run: |
          python -m pytest -q
          git diff --check
      - name: Commit validated wiring
        run: |
          if git diff --quiet -- app.py ui_copy.py LOCALIZATION.md; then
            echo "Wiring patch already applied."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py ui_copy.py LOCALIZATION.md
          git commit -m 'Wire Ask Dashboard answers to selected locale'
          git push origin HEAD:agent/multilingual-ask-answers
