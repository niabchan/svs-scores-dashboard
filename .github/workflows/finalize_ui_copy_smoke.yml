name: Finalize localized UI smoke test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  smoke:
    if: github.event.pull_request.head.ref == 'agent/localize-and-distill-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/localize-and-distill-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move English capability notice to the shared question area
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          marker = '    if st.session_state.get("lang", "en") != "en":\n        st.caption(ask_t("custom_question_notice"))\n'
          if marker in text:
              print('Capability notice already moved.')
          else:
              old = '''    suggested_question = st.selectbox(\n        ask_t("choose_suggested_question"),\n        SUGGESTED_QUESTIONS,\n        format_func=lambda value: suggested_question_label(\n            st.session_state.get("lang", "en"), value\n        ),\n    )\n\n    custom_question = ""\n'''
              new = '''    suggested_question = st.selectbox(\n        ask_t("choose_suggested_question"),\n        SUGGESTED_QUESTIONS,\n        format_func=lambda value: suggested_question_label(\n            st.session_state.get("lang", "en"), value\n        ),\n    )\n\n    if st.session_state.get("lang", "en") != "en":\n        st.caption(ask_t("custom_question_notice"))\n\n    custom_question = ""\n'''
              if text.count(old) != 1:
                  raise RuntimeError('Expected suggested-question block exactly once.')
              text = text.replace(old, new, 1)
              old_custom = '''    if suggested_question == QUESTION_CUSTOM:\n        st.info(ask_t("custom_question_notice"))\n        st.caption(ask_t("custom_question_help"))\n'''
              new_custom = '''    if suggested_question == QUESTION_CUSTOM:\n        st.caption(ask_t("custom_question_help"))\n'''
              if text.count(old_custom) != 1:
                  raise RuntimeError('Expected custom-question notice block exactly once.')
              text = text.replace(old_custom, new_custom, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile and test
        run: |
          python -m py_compile app.py ask_dashboard.py openai_intent.py data_loading.py usage_analytics.py ui_copy.py test_ask_dashboard.py test_alliance_score_overview.py test_data_loading.py test_usage_analytics.py test_ui_copy.py test_ui_copy_shell.py
          python -m pytest -q
          git diff --check
      - name: Run Streamlit headless smoke test
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          pid=$!
          ok=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep -q 'ok'; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/streamlit.log
            kill "$pid" || true
            exit 1
          fi
          kill "$pid" || true
          wait "$pid" || true
      - name: Commit finalized app if needed
        run: |
          if git diff --quiet -- app.py; then
            echo 'No app.py changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Clarify Ask Dashboard language boundary [ui-smoke-applied]'
          git push origin HEAD:agent/localize-and-distill-ui
