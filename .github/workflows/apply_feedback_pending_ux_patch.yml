name: Apply feedback pending UX patch

on:
  push:
    branches:
      - agent/multilingual-ask-answers

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multilingual-ask-answers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Apply exact feedback UX patch
        run: python scripts/apply_feedback_pending_ux_patch.py
      - name: Compile changed modules and regression test
        run: python -m py_compile app.py ui_copy.py test_feedback_pending_flow.py
      - name: Run full test suite
        run: |
          python -m pytest -q
          git diff --check
      - name: Commit validated patch
        run: |
          if git diff --quiet -- app.py ui_copy.py; then
            echo "Feedback pending UX patch already applied."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py ui_copy.py
          git commit -m 'Keep analytics retry plumbing behind feedback submission'
          git push origin HEAD:agent/multilingual-ask-answers

# Trigger after workflow creation.
