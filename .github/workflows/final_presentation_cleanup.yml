name: Apply final presentation cleanup

on:
  push:
    branches:
      - agent/multilingual-ask-answers
    paths:
      - scripts/apply_final_presentation_cleanup.py
      - .github/workflows/final_presentation_cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multilingual-ask-answers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Apply exact presentation cleanup
        run: python scripts/apply_final_presentation_cleanup.py
      - name: Compile
        run: python -m py_compile app.py ui_copy.py ask_dashboard/_answer_i18n.py test_answer_i18n.py
      - name: Run tests
        run: |
          python -m pytest -q
          git diff --check
      - name: Commit validated cleanup
        run: |
          if git diff --quiet -- app.py ui_copy.py ask_dashboard/_answer_i18n.py test_answer_i18n.py; then
            echo "Cleanup already applied."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py ui_copy.py ask_dashboard/_answer_i18n.py test_answer_i18n.py
          git commit -m 'Polish final Ask Dashboard presentation'
          git push origin HEAD:agent/multilingual-ask-answers
