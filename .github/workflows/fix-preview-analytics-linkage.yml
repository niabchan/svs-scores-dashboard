name: Fix preview analytics linkage

on:
  push:
    branches:
      - ask-dashboard-wip

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ask-dashboard-wip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply linkage fix
        run: python scripts/fix_preview_analytics_linkage.py
      - name: Commit linkage fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/fix-preview-analytics-linkage.yml scripts/fix_preview_analytics_linkage.py
          git commit -m "Only request feedback for persisted answers"
          git push
